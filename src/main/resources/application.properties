spring.application.name=ConectaClinica

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conectaclinica}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:myuser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:secret}

api.security.token.secret=${JWT_SECRET:4zY8xK2vN9pQ7mL1wE5rT0yU3iO6pA8sD1fG4hJ7kL0zX3cC6vB9nM2bV5cC8xZ1}
api.security.token.expiration=${JWT_EXPIRATION:86400000}

# E-mail SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true